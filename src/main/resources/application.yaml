server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: hackathon-demo-app

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: Hackathon Demo Application
    version: 1.0.0
    description: Demo application for AI-powered CI/CD monitoring
